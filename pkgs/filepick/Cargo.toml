[package]
name = "filepick"
version = "0.1.0"
edition = "2021"
description = "Vim-style fuzzy file selection, Wayland file copying, and drag handoff"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4"
nucleo = "0.5"
ratatui = "0.29"
serde_json = "1"
tempfile = "3"
url = "2.5"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"

[profile.release]
lto = "thin"
strip = true
