[package]
name = "window-overview"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Spatial, native Wayland workspace overview for Hyprland"

[dependencies]
anyhow = "1"
fontdue = "0.9"
fast_image_resize = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-hyprland = { version = "1.2", features = ["client"] }
xkbcommon = "0.9"

[profile.release]
lto = "thin"
strip = true
