# Toggle Fullscreen for the active window
bind = SUPER, f, fullscreen # keybind: Fullscreen

# Resize active window
binde = SUPER ALT, h, resizeactive, -60 0 # keybind: Shrink window width
binde = SUPER ALT, l, resizeactive, 60 0 # keybind: Grow window width
binde = SUPER ALT, k, resizeactive, 0 -60 # keybind: Shrink window height
binde = SUPER ALT, j, resizeactive, 0 60 # keybind: Grow window height

# Rotate the active Dwindle split. Requires Hyprland 0.55+.
bind = SUPER, r, layoutmsg, swapsplit # keybind: Swap split
bind = SUPER SHIFT, r, layoutmsg, rotatesplit # keybind: Rotate split

# Drag tiled windows with SUPER + left mouse button and let Hyprland retile them.
bindm = SUPER, mouse:272, movewindow # keybind: Move window with mouse
bindm = SUPER, mouse:273, resizewindow # keybind: Resize window with mouse





# ------------------------------------------------------
# Fn-keys functionallity 
# ------------------------------------------------------
# Audio Volume Control (using SwayOSD)
bindel = , XF86AudioRaiseVolume, exec, /home/hjalte/.dotfiles/scripts/output-volume raise # keybind: Volume up
bindel = , XF86AudioLowerVolume, exec, /home/hjalte/.dotfiles/scripts/output-volume lower # keybind: Volume down
bindl  = , XF86AudioMute, exec, /home/hjalte/.dotfiles/scripts/output-volume mute-toggle # keybind: Mute volume
bindl  = , XF86AudioMicMute, exec, /home/hjalte/.dotfiles/scripts/mic-toggle # keybind: Mute microphone

# Screen Brightness Control (using SwayOSD)
bindel = , XF86MonBrightnessUp, exec, swayosd-client --device amdgpu_bl1 --brightness +5 # keybind: Brightness up
bindel = , XF86MonBrightnessDown, exec, swayosd-client --device amdgpu_bl1 --brightness -5 # keybind: Brightness down

# Media Control
bindl  = , XF86AudioPlay, exec, playerctl play-pause # keybind: Play pause
bindl  = , XF86AudioNext, exec, playerctl next # keybind: Next track
bindl  = , XF86AudioPrev, exec, playerctl previous # keybind: Previous track
bindl  = , XF86Calculator, exec, firefox --new-window "https://www.wolframalpha.com/input?i=" # keybind: WolframAlpha

# Screenshots
# PrtSc: Vælg område -> Gem fil -> Kopiér fil til clipboard
bind = , Print, exec, mkdir -p "$HOME/Pictures/Screenshots" && filepath="$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png" && grim -g "$(slurp)" "$filepath" && wl-copy < "$filepath" && notify-send "Screenshot saved" "$filepath" # keybind: Area screenshot

# SHIFT + PrtSc: Hele skærmen -> Gem fil -> Kopiér fil til clipboard
bind = ALT, Print, exec, /home/hjalte/.local/bin/screenshot-focused-output # keybind: Active monitor screenshot
bindd = SUPER SHIFT, Print, Browse recent screenshots, exec, /home/hjalte/.local/bin/imagepick-menu --source screenshots

# ------------------------------------------------------
# (Add any other custom keybinds here or add as a group)
# ------------------------------------------------------

# Notifications
bind = SUPER, comma, exec, makoctl dismiss # keybind: Dismiss notification
bind = SUPER SHIFT, comma, exec, makoctl dismiss --all # keybind: Dismiss all notifications
bind = SUPER CTRL, comma, exec, /home/hjalte/.local/bin/notification-popups # keybind: Toggle notification popups
bind = SUPER, period, exec, /home/hjalte/.local/bin/notification-history # keybind: Notification history
bind = SUPER SHIFT, period, exec, ROFI_MENU_FULLSCREEN=1 /home/hjalte/.local/bin/notification-history # keybind: Notification history fullscreen


# Start Waybar after importing this login's Wayland environment into systemd.
exec-once = systemctl --user import-environment PATH WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE DISPLAY && systemctl --user start swayosd.service waybar.service
exec-once = systemctl --user restart dictation-live.service
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = system-theme apply
exec-once = systemctl --user restart battery-alert.service
exec-once = systemctl --user restart hyprsunset.service
exec-once = systemctl --user restart cliphist-text.service cliphist-image.service
exec-once = mako




# ------------------------------------------------------
# animation instant from workspaces
# ------------------------------------------------------
animations {
    enabled = true

    # Keep default animations for windows, but make workspaces instant (0)
    animation = workspaces, 0
}

# The laptop display key is normalized by keyd instead of masquerading as Super+t.
bind = , XF86Display, exec, /home/hjalte/.local/bin/display-menu # keybind: Display mode menu

# Extract Math to LaTeX
bind = SUPER CTRL, l, exec, /home/hjalte/.local/bin/math-ocr # keybind: Math OCR

bindd = SUPER SHIFT, Z, Zathura, exec, zathura
