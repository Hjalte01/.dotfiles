# Hyprland configuration overrides
# Add your custom settings here

$laptop_scale = 1
$external_scale = 1
$terminal = ghostty
# testing purposes set to true(default) 
# debug:disable_logs = false 


# Example overrides:
# ------------------------------------------------------
# Monitor defaults; the layout editor's saved positions override these below.
# ------------------------------------------------------
monitor = eDP-1, preferred, auto, $laptop_scale
monitor = HDMI-A-1, preferred, auto-left, $external_scale
monitor = DP-1, preferred, auto-left, $external_scale
monitor = DP-2, preferred, auto-left, $external_scale
monitor = , preferred, auto-left, $external_scale
monitor = idle, 1920x1080@60, auto-right, 1
source = ~/.config/hypr/monitor-layout.conf

env = QT_QPA_PLATFORMTHEME,qt5ct
env = DISPLAY_MENU_INTERNAL_SCALE,$laptop_scale
env = DISPLAY_MENU_EXTERNAL_SCALE,$external_scale

# trigger when the switch is turning on
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
# trigger when the switch is turning off
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, $laptop_scale"

# ------------------------------------------------------
# Input (caps=escape, natural_scroll, smooth movement)
# ------------------------------------------------------
input {
  kb_layout = dk
  kb_variant = nodeadkeys

  kb_options = caps:escape
  accel_profile = flat

  # Change speed of keyboard repeat
  repeat_rate = 50
  repeat_delay = 220

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Reduce accidental palm contact while typing
    disable_while_typing = true

    # Avoid 3-finger touchpad clicks becoming middle-click.
    clickfinger_behavior = false

    # Control the speed of your scrolling
    scroll_factor = 2
  }

  touchdevice {
    enabled = false
  }
}


# Keep touchscreen off by default, but keep touchpad enabled.
device {
    name = elan06fa:00-04f3:3293-touchpad
    enabled = true
}
cursor {
    no_hardware_cursors = false
}

# ------------------------------------------------------
# General Window Layout & Gaps
# ------------------------------------------------------
general {
# Space between windows
  gaps_in = 5

# Space between windows and the edge of the monitor (shrink this!)
    gaps_out = 10 

# Thickness of the window border
    border_size = 2 

# Resize tiled windows by grabbing the border between them.
    resize_on_border = true
    extend_border_grab_area = 12
    hover_icon_on_border = true

# Colors come from the shared palette below.
}
source = ~/.config/dotfiles-theme/current/hyprland.conf

# ------------------------------------------------------
# Styling of apps
# ------------------------------------------------------
decoration {
  rounding = 10
}

misc {
  # Focusing a covered window should reveal it by leaving fullscreen.
  on_focus_under_fullscreen = 2
}


# ------------------------------------------------------
# Change my 2.keyboard Alt-keys to nothing 
# ------------------------------------------------------
# Respectivelu: copy, paste, cut, undo, select all 
bind = ALT, c, exec, true
bind = ALT, v, exec, true
bind = ALT, x, exec, true
bind = ALT, z, exec, true
bind = ALT, a, exec, true 

