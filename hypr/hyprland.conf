# Terminal & Files
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER SHIFT, F, Downloads, exec, nautilus --new-window "$HOME/Downloads"
bindd = SUPER ALT, F, Search and attach files, exec, /home/hjalte/.local/bin/filepick-menu
bindd = SUPER CTRL, Z, Find PDFs in Zathura, exec, /home/hjalte/.local/bin/pdfpick-menu
bindd = SUPER ALT, D, Drag last selected files, exec, /home/hjalte/.local/bin/filepick-menu --drag-last

# Keep the file group available while moving to a browser on another workspace.
windowrule = match:class ^(dragon-drop)$, float on, size 480 260, center on, pin on

# Keep editor startup from stealing focus. Dialogs must retain normal parent
# workspace/focus behavior when the editor is moved to another workspace.
windowrule = match:class ^(robloxstudiobeta[.]exe)$, match:initial_title ^(.* - Roblox Studio)$, no_initial_focus on, focus_on_activate off, suppress_event activate activatefocus

# Wine/Studio creates three empty 100px helper windows (Vinegar issue #973).
# Studio also uses this title for real device selectors and other popups.
# Do not hide windows by title: the session launcher isolates only exact 100px
# helpers. Keep these floating so dialogs retain their own size and position.
windowrule = match:class ^(robloxstudiobeta[.]exe)$, match:initial_title ^(RobloxStudio)$, float on, no_initial_focus on

# Apps & Editors
bind = SUPER, B, exec, blueman-manager # keybind: Bluetooth
bind = SUPER, P, exec, /home/hjalte/.local/bin/display-menu # keybind: Display mode menu
bind = SUPER SHIFT, P, exec, ROFI_MENU_FULLSCREEN=1 /home/hjalte/.local/bin/display-menu # keybind: Display mode menu fullscreen
bindd = SUPER SHIFT, N, Editor, exec, $terminal -e nvim

# TUIs
bindd = SUPER SHIFT, B, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker

# Close active window
