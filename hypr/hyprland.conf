# Peek after 250 ms. Rust owns the timer; no per-key systemd jobs or QML IPC.
# Release handlers must be transparent: keyd's PrtSc translation temporarily
# releases/restores Super, and a screenshot must not shadow the final release.
bindni = , Super_L, exec, /home/hjalte/.local/bin/desktop-which-key hold-start
bindrnti = SUPER, Super_L, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
bindni = , Super_R, exec, /home/hjalte/.local/bin/desktop-which-key hold-start
bindrnti = SUPER, Super_R, exec, /home/hjalte/.local/bin/desktop-which-key hold-end

# Any key completing a Super chord dismisses the transient Super hints. These
# transparent, non-consuming binds run alongside the real shortcut; endPeek
