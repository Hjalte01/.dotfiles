bindnti = SUPER, F5, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
bindnti = SUPER, F6, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
bindnti = SUPER, F7, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
bindnti = SUPER, F8, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
bindnti = SUPER, F9, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
bindnti = SUPER, F10, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
bindnti = SUPER, F11, exec, /home/hjalte/.local/bin/desktop-which-key hold-end
